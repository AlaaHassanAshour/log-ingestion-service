services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DATABASE_URL=postgres://loguser:logpass@db:5432/logdb
      - AUTH_ENABLED=false
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: loguser
      POSTGRES_PASSWORD: logpass
      POSTGRES_DB: logdb
    ports:
      - "5432:5432"
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 1000M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loguser -d logdb"]
      interval: 3s
      timeout: 3s
      retries: 5
